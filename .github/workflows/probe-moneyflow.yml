# گرماسنج — پروبِ «روند پول» (تابلوخوانی + بورس‌تریدر)
# چرا؟ شکلِ واقعیِ پاسخِ هر منبع فقط با اجرای واقعی معلوم می‌شود.
# این جریان فقط می‌خواند و تنها خروجی‌اش یک فایلِ گزارش در reports/ است؛
# هیچ فایلِ داده‌ای (live.json / history.json) را تغییر نمی‌دهد.
name: پروب روند پول

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'scripts/probe_moneyflow.cjs'
      - '.github/workflows/probe-moneyflow.yml'

permissions:
  contents: write

concurrency:
  group: probe-moneyflow
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: اجرای پروب
        run: node scripts/probe_moneyflow.cjs --out=reports/probe-moneyflow.md

      - name: گزارش را در همین شاخه بنویس (هرگز روی main)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name 'garmasanj-bot'
          git config user.email 'garmasanj-bot@users.noreply.github.com'
          git add reports/probe-moneyflow.md
          if git diff --staged --quiet; then echo "تغییری در گزارش نبود"; exit 0; fi
          git commit -q -m "chore(probe): گزارش روند پول ($(date -u +%FT%TZ)) [skip ci]"
          for i in 1 2 3; do
            if git push -q; then exit 0; fi
            echo "push failed ($i) — rebasing"
            git pull -q --rebase --autostash || { git rebase --abort || true; git reset -q --hard @{upstream} || git reset -q --hard HEAD; }
            sleep 5
          done
          echo "::warning::push of probe report failed"

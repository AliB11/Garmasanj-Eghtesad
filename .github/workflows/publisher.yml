# گرماسنج — انتشار زنده‌ی قیمت‌ها + تاریخچه (نسل ۹: چرخه‌ی ساعتی)
# همه‌ی منابع سمت‌سرور خوانده می‌شوند (جایی که CORS اعمال نمی‌شود)،
# خروجی نرمال‌شده در assets/data/live.json و یک نقطه‌ی تاریخچه در
# assets/data/history.json کامیت می‌شود.
#
# چرخه‌ی بروزرسانی (نسل ۹): cron هر ساعت یک‌بار (۰ دقیقه) + در هر اجرا
# ROUNDS دور با فاصله‌ی INTERVAL_MIN دقیقه → پوششِ تقریباً پیوسته‌ی ساعتی
# (دو نقطه در هر ساعت). منابعِ بورس (بورس‌تریدر + تابلوخوانی) داخل ناشر
# نگهبانِ ۶۰ دقیقه‌ای دارند، پس جریانِ پول هر ساعت تازه می‌شود.
#
# نکته‌ی صادقانه: cron گیت‌هاب «تلاش حداکثری» است؛ اگر یک اجرا دیر کند یا
# جا بیفتد، دورِ بعدیِ اجرای بعد جبران می‌کند (نگهبان‌های interval داخل ناشر).
name: انتشار زنده قیمت‌ها

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'تعداد دورهای انتشار در این اجرا'
        default: '2'
        required: false

permissions:
  contents: write

concurrency:
  group: live-publish
  cancel-in-progress: false

env:
  ROUNDS: ${{ github.event.inputs.rounds || '2' }}
  INTERVAL_MIN: '30'
  # مسیرهای کلیددار (اختیاری): اگر این Secrets تنظیم شوند، ناشر از آن‌ها هم
  # استفاده می‌کند؛ اگر نباشند، این مسیرها کاملاً خاموش می‌مانند.
  # کلیدها هرگز وارد کد، لاگ یا فایلِ داده نمی‌شوند.
  NAVASAN_KEY: ${{ secrets.NAVASAN_KEY }}
  BRS_API_KEY: ${{ secrets.BRS_API_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: اجرای ناشر (چند دور) و کامیت
        run: |
          git config user.name 'garmasanj-bot'
          git config user.email 'garmasanj-bot@users.noreply.github.com'

          commit_and_push() {
            git add assets/data/live.json assets/data/history.json
            if git diff --staged --quiet; then echo "no changes"; return 0; fi
            TS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('assets/data/live.json','utf8')).generated_at)")
            # [skip ci] → کامیت‌های داده‌ای، CI تست‌ها را فعال نمی‌کنند
            git commit -q -m "chore(data): انتشار زنده قیمت‌ها ($TS) [skip ci]"
            for i in 1 2 3; do
              if git push -q; then return 0; fi
              echo "push failed (attempt $i) — rebasing onto latest upstream"
              # شاخه‌ی جاری را با بالادستِ خودش هماهنگ کن (وابسته به نام شاخه نباشد)
              if ! git pull -q --rebase --autostash; then
                git rebase --abort || true
                git reset -q --hard @{upstream} || git reset -q --hard HEAD
                node scripts/publish.cjs
                git add assets/data/live.json assets/data/history.json
                git commit -q -m "chore(data): انتشار زنده قیمت‌ها ($TS) [skip ci]" || true
              fi
              sleep 5
            done
            echo "::warning::push failed after 3 attempts — next round/run will retry"
            return 0
          }

          for r in $(seq 1 "$ROUNDS"); do
            echo "── round $r/$ROUNDS  $(date -u +%FT%TZ)"
            node scripts/publish.cjs || echo "::warning::publish round $r failed"
            commit_and_push
            if [ "$r" -lt "$ROUNDS" ]; then sleep $(( INTERVAL_MIN * 60 )); fi
          done
